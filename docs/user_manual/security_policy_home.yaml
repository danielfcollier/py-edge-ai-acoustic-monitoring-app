# 🏠 Home Security & Peace — Example Policy
#
# Full-featured example covering:
#   - Break-in detection (glass, gunshots, explosions)
#   - Suspicious night activity (knocks, footsteps)
#   - Dog barking (any hour, privacy-exempt)
#   - Music instruments during quiet hours
#   - Night disturbances (screams, loud music, crowd noise)
#   - Physics fallback rules (dB threshold, day and night)
#
# ⚠️  VOICE RECORDING NOTICE
#     Speech and narration are suppressed at the model level.
#     Chattering and crowd noise CAN be captured as disturbance evidence
#     via the Crowd Noise policy (Hubbub label).
#     Raised voices are detected only via Screaming, Yell, Shout, and
#     Children shouting — labels that indicate distress or aggression.
#
# Copy this file and adjust thresholds, hours, and actions for your setup.

variables:
  day_start: 6
  night_start: 22
  day_limit: 55.0
  night_limit: 45.0
  calibration_file_path: "path/to/calibration.txt"

hardware:
  calibration_file: "{calibration_file_path}"

services:
  internet_enabled: true
  heartbeat_enabled: true
  telegram_enabled: true
  cloud_storage_enabled: true
  recording_output_path: "recordings"
  heartbeat_interval_seconds: 3600
  hc_ping_url: "{HC_PING_URL}"
  retry_attempts: 3
  retry_delay_seconds: 5
  alert_cooldown_seconds: 60
  day_start_hour: "{day_start}"
  night_start_hour: "{night_start}"
  telegram_notification_mode: "instant"
  alert_min_display_confidence: 0.4
  cloud:
    provider: "s3"
    bucket_name: "{S3_BUCKET}"

feature_extractor:
  sad_threshold_rms: 0.003
  sad_threshold_flux: 1.5
  sad_threshold_dbspl: 45.0
  exclude_classes:
    # Background / ambient noise
    - "Silence"
    - "Inside, small room"
    - "Wind"
    - "Wind noise"
    - "White noise"
    - "Mouse"
    - "Mechanical fan"
    - "Camera"
    - "Outside, rural or natural"
    - "Mechanisms"
    - "Sound Effect"
    - "Rustling leaves"
    # Birds / wildlife — dawn chorus triggers dB rules otherwise.
    # Note: "Dog", "Bark", "Howl" are NOT excluded.
    - "Animal"
    - "Wild animals"
    - "Bird"
    - "Bird vocalization, bird call, bird song"
    - "Chirp, tweet"
    - "Crow"
    - "Frog"
    # Voice recording exclusions
    - "Speech"
    - "Child speech, kid speaking"
    - "Narration, monologue"
    - "Speech synthesizer"

reporting:
  days_to_report: 30
  limits:
    day_db: "{day_limit}"
    night_db: "{night_limit}"
  category_mapping:
    "Glass": "Security"
    "Shatter": "Security"
    "Breaking": "Security"
    "Smash, crash": "Security"
    "Gunshot, gunfire": "Security"
    "Explosion": "Security"
    "Bang": "Security"
    "Knock": "Security"
    "Door": "Security"
    "Walk, footsteps": "Security"
    "Dog": "Dog Barking"
    "Bark": "Dog Barking"
    "Howl": "Dog Barking"
    "Whimper": "Dog Barking"
    "Domestic animals, pets": "Dog Barking"
    "Livestock, farm animals, working animals": "Dog Barking"
    "Musical instrument": "Instruments"
    "Guitar": "Instruments"
    "Piano": "Instruments"
    "Drum": "Instruments"
    "Singing": "Instruments"
    "Music": "Music"
    "Dance music": "Music"
    "Rock music": "Music"
    "Electronic dance music": "Music"
    "Screaming": "Disturbance"
    "Yell": "Disturbance"
    "Shout": "Disturbance"
    "Children shouting": "Disturbance"
    "Crowd": "Disturbance"

policies:
  # ---------------------------------------------------------------------------
  # INTRUSIONS — fires any hour, ignores privacy mode
  # ---------------------------------------------------------------------------

  - name: "Critical Intrusion"
    description: "Break-in and weapon sounds — immediate alert regardless of privacy mode."
    condition: >
      current_event_label in [
        'Glass', 'Shatter', 'Breaking', 'Smash, crash',
        'Gunshot, gunfire', 'Machine gun', 'Cap gun',
        'Explosion', 'Bang'
      ] and current_confidence > 0.8
    actions:
      - "log_metadata"
      - "record_evidence"
      - "telegram_alert"
      - "cloud_upload"
    ignore_privacy: true

  - name: "Suspicious Activity (Night)"
    description: "Knocks, door movements, and footsteps during 00:00–06:59."
    condition: >
      current_event_label in [
        'Knock', 'Door', 'Sliding door', 'Walk, footsteps'
      ] and current_confidence > 0.5 and current_hour < 7
    actions:
      - "log_metadata"
      - "record_evidence"
      - "telegram_alert"
      - "cloud_upload"

  # ---------------------------------------------------------------------------
  # DOG BARKING — fires any hour, ignores privacy mode
  # ---------------------------------------------------------------------------

  - name: "Dog Barking"
    description: "Records and alerts on dog vocalizations for noise logs and dispute evidence."
    condition: >
      (current_event_label in [
        'Dog', 'Bark', 'Howl',
        'Whimper', 'Whimper (dog)',
        'Canidae, dogs, wolves',
        'Domestic animals, pets'
      ] and current_confidence > 0.45)
      or
      (current_event_label in [
        'Livestock, farm animals, working animals'
      ] and current_confidence > 0.45)
    actions:
      - "log_metadata"
      - "record_evidence"
      - "telegram_alert"
      - "cloud_upload"
    ignore_privacy: true

  # ---------------------------------------------------------------------------
  # MUSIC INSTRUMENTS — alert during quiet hours
  # ---------------------------------------------------------------------------

  - name: "Instruments (Quiet Hours)"
    description: "Alert and record instrument playing at night or before 08:00."
    condition: >
      current_event_label in [
        'Musical instrument',
        'Guitar', 'Acoustic guitar', 'Electric guitar', 'Bass guitar',
        'Steel guitar, slide guitar', 'Plucked string instrument',
        'Piano', 'Electric piano', 'Keyboard (musical)',
        'Drum', 'Drum kit', 'Drum machine', 'Snare drum', 'Bass drum',
        'Violin, fiddle', 'Cello', 'Bowed string instrument',
        'Flute', 'Trumpet', 'Saxophone',
        'Brass instrument', 'Wind instrument, woodwind instrument',
        'Singing', 'Child singing', 'Vocal music'
      ] and current_confidence > 0.5 and (is_night or current_hour < 8)
    actions:
      - "log_metadata"
      - "record_evidence"
      - "telegram_alert"
      - "cloud_upload"
    ignore_privacy: true

  # ---------------------------------------------------------------------------
  # NIGHT & EARLY MORNING DISTURBANCES — active 22:00–08:00
  # Raised voices captured via Yell/Shout/Screaming, not Speech/Conversation.
  # ---------------------------------------------------------------------------

  - name: "Screams & Distress (Night)"
    description: "Screaming, yelling, or crying during quiet hours — possible distress or aggression."
    condition: >
      current_event_label in [
        'Screaming', 'Yell', 'Shout',
        'Children shouting',
        'Crying, sobbing'
      ] and current_confidence > 0.45 and (is_night or current_hour < 8)
    actions:
      - "log_metadata"
      - "record_evidence"
      - "telegram_alert"
      - "cloud_upload"
    ignore_privacy: true

  - name: "Loud Music (Night)"
    description: "Music playing at night or before 08:00."
    condition: >
      current_event_label in [
        'Music', 'Dance music', 'Electronic dance music',
        'Rock music', 'Hip hop music', 'Pop music',
        'Drum and bass', 'House music', 'Electronic music',
        'Ambient music', 'Angry music'
      ] and current_confidence > 0.45 and (is_night or current_hour < 8)
    actions:
      - "log_metadata"
      - "record_evidence"
      - "telegram_alert"
      - "cloud_upload"

  - name: "Crowd Noise (Night)"
    description: "Crowd or party noise during quiet hours."
    condition: >
      current_event_label in ['Crowd', 'Hubbub, speech noise, speech babble']
      and current_confidence > 0.45 and (is_night or current_hour < 8)
    actions:
      - "log_metadata"
      - "record_evidence"
      - "telegram_alert"
      - "cloud_upload"

  # ---------------------------------------------------------------------------
  # PHYSICS FALLBACK — catches events that YAMNet mislabels
  # ---------------------------------------------------------------------------

  - name: "Loud dB Threshold (Night)"
    description: "Sustained loud sound above threshold during quiet hours, excluding natural sources."
    condition: >
      metrics['dbspl'] > 48.0
      and (is_night or current_hour < 8)
      and current_event_label not in [
        'Animal', 'Wild animals', 'Bird', 'Bird vocalization, bird call, bird song',
        'Chirp, tweet', 'Crow', 'Frog', 'Rain', 'Thunder', 'Outside, urban or manmade'
      ]
    actions:
      - "log_metadata"
      - "record_evidence"
      - "telegram_alert"
      - "cloud_upload"

  - name: "Loud dB Threshold (Day)"
    description: "Sound above 58 dB during the day — catches events YAMNet mislabels."
    condition: >
      metrics['dbspl'] > 58.0
      and is_day
      and current_event_label not in [
        'Animal', 'Wild animals', 'Bird', 'Bird vocalization, bird call, bird song',
        'Chirp, tweet', 'Crow', 'Frog', 'Rain', 'Thunder', 'Outside, urban or manmade'
      ]
    actions:
      - "log_metadata"
      - "record_evidence"
      - "telegram_alert"
      - "cloud_upload"
