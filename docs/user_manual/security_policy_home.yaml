  #     - "cloud_upload"

  # ---------------------------------------------------------------------------
  # DOG BARKING — fires any hour, ignores privacy mode
  # ---------------------------------------------------------------------------

  - name: "Dog Barking"
    description: "Records and alerts on dog vocalizations for noise logs and dispute evidence."
    condition: >
      current_event_label in [
        'Dog', 'Bark', 'Howl',
        'Whimper', 'Whimper (dog)',
        'Canidae, dogs, wolves',
        'Domestic animals, pets'
      ] and current_confidence > 0.45
    actions:
      - "log_metadata"
      - "record_evidence"
      - "telegram_alert"
      - "cloud_upload"
    ignore_privacy: true

  # ---------------------------------------------------------------------------
  # MUSIC INSTRUMENTS — alert during quiet hours, silent log during the day
  # ---------------------------------------------------------------------------

