# 🏠 Home Security & Peace (Home Mode)
#
# All rules run simultaneously. Covers:
#   - Intrusions & suspicious night activity
#   - Dog barking
#   - Music instruments (quiet hours alert)
#   - Night & early morning disturbances (screams, loud music, crowds)
#
# ⚠️  VOICE RECORDING NOTICE
#     Quiet speech and narration are suppressed at the model level (Speech,
#     Child speech, Narration labels excluded). However, chattering and
#     unclear conversation noise CAN be recorded as neighbourhood disturbance
#     evidence via the Crowd Noise policy (Hubbub label).
#     Raised voices are detected via Screaming, Yell, Shout, and Children
#     shouting — labels that indicate distress or aggression.

variables:
  day_start: 6
  night_start: 22
  day_limit: 55.0
  night_limit: 45.0
  calibration_file_path: "src/umik-1/7175488.txt"

hardware:
  calibration_file: "{calibration_file_path}"

services:
  internet_enabled: false
  heartbeat_enabled: true
  telegram_enabled: true
  cloud_storage_enabled: false
  recording_output_path: "recordings"
  heartbeat_interval_seconds: 60
  gpio_heartbeat_pin: 17
  hc_ping_url: "{HC_PING_URL}"
  retry_attempts: 3
  retry_delay_seconds: 5
  alert_cooldown_seconds: 60
  day_start_hour: "{day_start}"
  night_start_hour: "{night_start}"
  telegram_notification_mode: "cumulative"
  telegram_cumulative_window_minutes: 5
  alert_min_display_confidence: 0.3
  cloud:
    provider: "magalu"
    bucket_name: "{MAGALU_BUCKET}"

feature_extractor:
  model_path: "src/yamnet/yamnet.onnx"
  sad_threshold_rms: 0.002
  sad_threshold_flux: 1.0
  sad_threshold_dbspl: 45.0
  exclude_classes:
    # Background / ambient noise — would produce false positives
    - "Silence"
    - "Inside, small room"
    - "Wind"
    - "Wind noise"
    - "White noise"
    - "Mouse"
    - "Mechanical fan"
    - "Camera"
    - "Outside, rural or natural"
    - "Mechanisms"
    - "Sound Effect"
    - "Rustling leaves"
    # Birds / wildlife — dawn chorus triggers dB threshold rule otherwise.
    # Note: "Dog", "Bark", "Howl" are separate labels and are NOT excluded.
    - "Animal"
    - "Wild animals"
    - "Bird"
    - "Bird vocalization, bird call, bird song"
    - "Chirp, tweet"
    - "Crow"
    - "Frog"
    # Voice recording exclusions — scores zeroed at model level so these labels
    # can never become the top prediction and never trigger any policy.
    - "Speech"
    - "Child speech, kid speaking"
    - "Narration, monologue"
    - "Speech synthesizer"

reporting:
  days_to_report: 30
  limits:
    day_db: "{day_limit}"
    night_db: "{night_limit}"
  category_mapping:
    "Glass": "Security"
    "Shatter": "Security"
    "Breaking": "Security"
    "Smash, crash": "Security"
    "Gunshot, gunfire": "Security"
    "Explosion": "Security"
    "Bang": "Security"
    "Knock": "Security"
    "Door": "Security"
    "Walk, footsteps": "Security"
    "Dog": "Dog Barking"
    "Bark": "Dog Barking"
    "Howl": "Dog Barking"
    "Whimper": "Dog Barking"
    "Domestic animals, pets": "Dog Barking"
    "Musical instrument": "Instruments"
    "Guitar": "Instruments"
    "Piano": "Instruments"
    "Drum": "Instruments"
    "Drum kit": "Instruments"
    "Violin, fiddle": "Instruments"
    "Flute": "Instruments"
    "Trumpet": "Instruments"
    "Saxophone": "Instruments"
    "Singing": "Instruments"
    "Music": "Music"
    "Dance music": "Music"
    "Rock music": "Music"
    "Electronic dance music": "Music"
    "Screaming": "Disturbance"
    "Yell": "Disturbance"
    "Shout": "Disturbance"
    "Children shouting": "Disturbance"
    "Crowd": "Disturbance"

policies:
