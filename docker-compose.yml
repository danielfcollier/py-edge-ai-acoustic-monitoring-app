services:
  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: edge_prometheus
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.1
    container_name: edge_grafana
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docs/grafana/ai-acoustic-monitor-dashboard.json:/var/lib/grafana/dashboards/ai-acoustic-monitor.json:ro
    ports:
      - "3001:3000"
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
