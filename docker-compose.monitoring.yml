version: '3.8'

services:
  # The Database
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: edge_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      # Use a named volume or host path for data persistence
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: always

  # The Dashboard
  grafana:
    image: grafana/grafana:10.0.0
    container_name: edge_grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    restart: always

volumes:
  prometheus_data:
  grafana_data: