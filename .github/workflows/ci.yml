name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:

jobs:
  test:
    name: Check and Test
    runs-on: ubuntu-latest

    env:
      UV_CACHE_DIR: /tmp/.uv-cache

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libsndfile1

      - name: Install dependencies
        run: make install

      - name: Run Linting
        run: make lint

      - name: Run Spell Check
        run: make spell-check

      - name: Run Tests
        run: uv run pytest -q

  # ---------------------------------------------------------------------------
  # Build .deb for ARM64 — validates the package builds cleanly on every PR
  # ---------------------------------------------------------------------------
  build-deb:
    name: Build .deb (ARM64)
    runs-on: ubuntu-24.04-arm
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-all python3-setuptools \
            debhelper dh-python build-essential dpkg-dev \
            libportaudio2 libsndfile1

      - name: Install Python 3.12 via uv
        run: uv python install 3.12

      - name: Install project and dev dependencies
        run: uv sync --group dev --no-install-project

      - name: Vendor dependencies (ARM64, py3.12)
        run: |
          mkdir -p src/app/vendor
          touch src/app/vendor/__init__.py
          uv export --no-dev --frozen --format requirements-txt | grep -v "file://" > requirements.frozen.txt
          uv pip install -r requirements.frozen.txt --target src/app/vendor --python 3.12
          rm requirements.frozen.txt

      - name: Build .deb
        env:
          BUILD_PYTHON_VERSION: "3.12"
        run: bash build_deb.sh --skip
