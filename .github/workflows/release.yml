name: Release

# Triggered when a GitHub Release is published.
# Create a release via: GitHub UI → Releases → Draft a new release → Publish release.
#
# GitHub Secrets required (Settings → Secrets and variables → Actions → Secrets):
#   MAGALU_KEY          — Magalu Cloud access key
#   MAGALU_SECRET       — Magalu Cloud secret key
#   GPG_KEY_ID          — GPG key fingerprint used to sign the APT repository
#   GPG_KEY             — Armored private key  (gpg --armor --export-secret-keys <KEY_ID>)
#   GPG_PUBKEY          — Armored public key   (gpg --armor --export <KEY_ID>)
#
# GitHub Variables required (Settings → Secrets and variables → Actions → Variables):
#   S3_ENDPOINT         — e.g. https://br-se1.magaluobjects.com
#   S3_REGION           — e.g. br-se1
#   DEB_S3_BUCKET       — bucket name
#
# All secrets/variables above must also be present in the "apt" deployment
# environment (Settings → Environments → apt).

on:
  release:
    types: [published]

jobs:
  # ---------------------------------------------------------------------------
  # 1. Re-run CI to confirm the release commit is green
  # ---------------------------------------------------------------------------
  verify-ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # ---------------------------------------------------------------------------
  # 2. Build .deb on native ARM64
  #    py3.12 → bookworm, noble  (version: X.Y.Z)
  #    py3.13 → trixie            (version: X.Y.Z+py313, distinct pool entry)
  #
  #    The +py313 suffix gives each build a unique filename in S3, preventing
  #    the py3.13 .deb from overwriting the py3.12 one in the pool.
  # ---------------------------------------------------------------------------
  build-deb:
    name: Build .deb (ARM64, py${{ matrix.python_version }})
    runs-on: ubuntu-24.04-arm
    needs: verify-ci

    strategy:
      matrix:
        include:
          - python_version: "3.12"
            version_suffix: ""
            artifact: deb-arm64-py312
            apt_dists: "bookworm,noble"
          - python_version: "3.13"
            version_suffix: "+py313"
            artifact: deb-arm64-py313
            apt_dists: "trixie"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Sync version with release tag
        run: |
          CLEAN_VERSION="${{ github.event.release.tag_name }}"
          CLEAN_VERSION="${CLEAN_VERSION#v}${{ matrix.version_suffix }}"
          sed -i "s/^version = \".*\"/version = \"$CLEAN_VERSION\"/" pyproject.toml
          sed -i "s/__version__ = \".*\"/__version__ = \"$CLEAN_VERSION\"/" src/app/__init__.py

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-all python3-setuptools \
            debhelper dh-python build-essential dpkg-dev \
            libportaudio2 libsndfile1

      - name: Install Python ${{ matrix.python_version }} via uv
        run: uv python install ${{ matrix.python_version }}

      - name: Install dev dependencies (includes stdeb)
        run: uv sync --group dev --no-install-project

      - name: Vendor Python dependencies (ARM64, py${{ matrix.python_version }})
        run: |
          mkdir -p src/app/vendor
          touch src/app/vendor/__init__.py
          uv export --no-dev --frozen --format requirements-txt | grep -v "file://" > requirements.frozen.txt
          uv pip install -r requirements.frozen.txt --target src/app/vendor --python ${{ matrix.python_version }}
          rm requirements.frozen.txt

      - name: Build .deb
        env:
          BUILD_PYTHON_VERSION: ${{ matrix.python_version }}
        run: bash build_deb.sh --skip

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: deb_dist/*.deb
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3. Publish to S3 APT repository
  # ---------------------------------------------------------------------------
  publish-apt:
    name: Publish to APT Repository
    runs-on: ubuntu-latest
    needs: [verify-ci, build-deb]
    environment: apt

    env:
      S3_ACCESS_KEY_ID: ${{ secrets.MAGALU_KEY }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.MAGALU_SECRET }}
      S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
      S3_REGION: ${{ vars.S3_REGION }}
      GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
      GPG_KEY_FILE: ai-acoustic-monitor.gpg.key
      GPG_PUBKEY_FILE: ai-acoustic-monitor.gpg.pub

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Download arm64 .deb (py3.12)
        uses: actions/download-artifact@v4
        with:
          name: deb-arm64-py312
          path: deb_dist/arm64-py312/

      - name: Download arm64 .deb (py3.13)
        uses: actions/download-artifact@v4
        with:
          name: deb-arm64-py313
          path: deb_dist/arm64-py313/

      - name: Write GPG keys
        run: |
          printf '%s\n' "$GPG_KEY"    > ai-acoustic-monitor.gpg.key
          printf '%s\n' "$GPG_PUBKEY" > ai-acoustic-monitor.gpg.pub
        env:
          GPG_KEY: ${{ secrets.GPG_KEY }}
          GPG_PUBKEY: ${{ secrets.GPG_PUBKEY }}

      - name: Verify GPG key
        run: |
          echo "Key file first line: $(head -1 ai-acoustic-monitor.gpg.key)"
          echo "Key file line count: $(wc -l < ai-acoustic-monitor.gpg.key)"
          tmpdir=$(mktemp -d) && chmod 700 "$tmpdir"
          GNUPGHOME="$tmpdir" gpg --batch --import ai-acoustic-monitor.gpg.key \
            && echo "GPG import: OK" \
            || { echo "GPG import: FAILED"; exit 1; }

      - name: Publish arm64 .deb (bookworm, noble)
        run: |
          uv run --group publish python publish_repo.py \
            "$(find deb_dist/arm64-py312 -name '*.deb' | head -1)" \
            "${{ vars.DEB_S3_BUCKET }}"
        env:
          APT_DISTS: "bookworm,noble"

      - name: Publish arm64 .deb (trixie)
        run: |
          uv run --group publish python publish_repo.py \
            "$(find deb_dist/arm64-py313 -name '*.deb' | head -1)" \
            "${{ vars.DEB_S3_BUCKET }}"
        env:
          APT_DISTS: "trixie"

      - name: Attach ONNX model to release
        run: gh release upload "${{ github.event.release.tag_name }}" src/yamnet/yamnet.onnx --clobber
        env:
          GH_TOKEN: ${{ github.token }}
